- rule: Monitor /etc/shadow access
  id: FIM-001
  des: Monitor /etc/shadow when accessed by bash with pid 56 or by uid 100
  path: /etc/shadow
  fname: shadow
  action: monitor
  priority: CRITICAL
  output: Access to /etc/shadow detected.
  condition: (process.name == 'bash' and process.id == 56) or (user.id == 100)
  hooked: [open, write, read, unlink]
  tags: [fim, linux, credentials]

- rule: Block Execution from /tmp
  id: BE-001
  des: Block any process execution from /tmp directory
  path: /tmp/
  fname: "*"
  action: block
  priority: HIGH
  output: Execution from /tmp blocked.
  condition: process.path startswith '/tmp/'
  hooked: [execve, execveat]
  tags: [process, hardening]
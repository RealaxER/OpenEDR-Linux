- macro: open_write
  condition: syscall == open 
    or syscall == read 
    or syscall == write

- macro: open_read
  condition: syscall == open 
    or syscall == read 

- list: shell_binaries
  items: [ash, bash, csh, ksh, sh, tcsh, zsh, dash]

- rule: Monitor /etc/shadow access
  id: BDH-01
  des: Monitor /etc/shadow when accessed by bash with pid 56 or by uid 100
  path: /etc/shadow
  fname: shadow
  action: monitor
  priority: CRITICAL
  output: Access to /etc/shadow detected.
  condition: syscall == unlink or (open_read) or comm in {shell_binaries}
  
  hooked: [open, write, read, unlink]
  tags: [fim, linux, credentials]


